<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Management</title>
    <!-- style.css 연결 -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- 페이지 전체 내용을 감싸는 컨테이너 -->
    <main class="container">
        <header>
            <h1>Member Management</h1>
        </header>

        
        <!-- 회원 목록 영역 -->
        <section class="card">
            <h2>회원 목록</h2>
            <table>
                <thead>
                    <tr>
                        <th>이름</th>
                        <th>이메일</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>홍길동</td>
                        <td>gildong@example.com</td>
                    </tr>
                    <tr>
                        <td>김철수</td>
                        <td>chulsoo@example.com</td>
                    </tr>
                </tbody>
            </table>
            <!-- 버튼처럼 보이는 링크: 클릭하면 아래 회원 등록 폼으로 이동 -->
            <a class="button-link" href="#member-form">회원 등록</a>
        </section>

         <!-- 회원 목록 영역 -->
        <section class="card">
            <h2>회원 등록</h2>
            <form id="member-form">
                <label for="name">이름</label>
                <input type="text" id="name" name="name">

                <label for="email">이메일</label>
                <input type="email" id="email" name="email">

                <button type="submit">회원 등록</button>
            </form>
        </section>
    </main>
</body>
